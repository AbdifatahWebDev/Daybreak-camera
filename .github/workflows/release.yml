# Builds the release APK. To save Actions minutes it runs only when a new
# version is set, never on ordinary pushes:
#   - VERSION changes on main  -> builds, then creates the tag and the release
#   - a v* tag is pushed       -> builds and releases that tag
#   - started by hand          -> builds only (APK attached to the run)
# A version with a suffix (0.2.0-rc.1) becomes a pre-release.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and release
    # Pinned: this image ships the Android SDK. Gradle installs the NDK itself.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          elif [[ -f VERSION ]]; then
            name="$(tr -d '[:space:]' < VERSION)"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$name' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # Version code: 0.1.1 -> 10199, 0.2.0-rc.3 -> 20003, 0.2.0 -> 20099.
          # A release sorts above its pre-releases, so updates always go up.
          base="${name%%-*}"
          pre="${name#"$base"}"
          IFS=. read -r major minor patch <<< "$base"
          if [[ -z "$pre" ]]; then
            step=99
          else
            n="$(grep -oE '[0-9]+' <<< "$pre" | tail -1 || true)"
            step=$(( 10#${n:-0} > 98 ? 98 : 10#${n:-0} ))
          fi
          code=$(( major * 1000000 + minor * 10000 + patch * 100 + step ))
          prerelease=false
          if [[ "$name" == *-* ]]; then prerelease=true; fi
          echo "Version $name, code $code, prerelease $prerelease"
          {
            echo "name=$name"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Show the build machine
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          echo "Runner: $(lsb_release -ds 2>/dev/null || uname -a)"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          java -version 2>&1 | head -1
          ls "${ANDROID_HOME:-/nonexistent}" "${ANDROID_HOME:-/nonexistent}/ndk" 2>&1 || true

      - name: Prepare the signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYBREAK_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DAYBREAK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: the APK is signed with a temporary key." | tee -a "$RUNNER_TEMP/ci.log"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        shell: bash
        env:
          DAYBREAK_KEYSTORE_PASSWORD: ${{ secrets.DAYBREAK_KEYSTORE_PASSWORD }}
          DAYBREAK_KEY_ALIAS: ${{ secrets.DAYBREAK_KEY_ALIAS }}
          DAYBREAK_KEY_PASSWORD: ${{ secrets.DAYBREAK_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleGithubRelease testGithubReleaseUnitTest \
            -PdaybreakVersionName="${{ steps.version.outputs.name }}" \
            -PdaybreakVersionCode="${{ steps.version.outputs.code }}" 2>&1 | tee build.log

      - name: Collect the APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/daybreak-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: daybreak-${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Daybreak ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*
          body: |
            Daybreak ${{ steps.version.outputs.name }} for Android 10 and newer (64-bit ARM phones).

            Install `daybreak-${{ steps.version.outputs.name }}.apk`. Photos are saved as JPEG XL in `DCIM/Daybreak`.
            Most gallery apps can't show JPEG XL yet: use Daybreak's library, and **Share** sends a JPEG copy.

            ${{ steps.signing.outputs.signed == 'true' && 'Signed with the Daybreak release key.' || '**Test build:** signed with a temporary key. When the permanent key is added, uninstall this build before installing the next one.' }}

      # Actions logs need a login to read, so a failed run also saves its log
      # to the ci-logs branch.
      - name: Save the build log for review
        if: failure()
        shell: bash
        env:
          LOG_NAME: ${{ steps.version.outputs.name && format('v{0}', steps.version.outputs.name) || github.ref_name }}
        run: |
          log="$RUNNER_TEMP/failure.log"
          {
            echo "Failed run ${GITHUB_RUN_NUMBER} for ${GITHUB_SHA}"
            echo "== setup =="
            cat "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "(no setup log: a step before 'Work out the version' failed)"
            echo "== gradle =="
            cat build.log 2>/dev/null || echo "(Gradle did not start)"
          } > "$log"
          git config user.name "Daybreak CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="logs/${LOG_NAME//\//_}-run${GITHUB_RUN_NUMBER}.log"
          tmp="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin ci-logs > /dev/null 2>&1; then
            git fetch --depth=1 origin ci-logs
            git worktree add --detach "$tmp" FETCH_HEAD
          else
            git worktree add --detach "$tmp"
            (cd "$tmp" && git checkout --orphan ci-logs && git rm -rf --quiet .)
          fi
          mkdir -p "$tmp/logs"
          tail -c 900000 "$log" > "$tmp/$dest"
          (cd "$tmp" && git add "$dest" && git commit -m "CI log for $LOG_NAME run $GITHUB_RUN_NUMBER" && git push origin HEAD:refs/heads/ci-logs)
