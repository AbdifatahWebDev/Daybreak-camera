# Tests and a debug build. Manual runs only (Actions tab > Checks > Run workflow).
name: Checks

on:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S native -B build-native -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DDAYBREAK_BUILD_TESTS=ON -DDAYBREAK_SANITIZE=ON -DDAYBREAK_WERROR=ON
      - name: Build
        run: cmake --build build-native
      - name: Test
        run: ctest --test-dir build-native --output-on-failure

  android:
    name: Debug build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
      - name: Build and test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
